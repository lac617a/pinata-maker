allowBuilds:
  core-js: true
  sharp: true
  # Resolutor nativo que usa el plugin de imports de ESLint. Trae binarios
  # precompilados; el script de build es solo el camino de respaldo.
  unrs-resolver: true

# Next.js fija versiones exactas de postcss y sharp que arrastran advisories
# conocidos. Se fuerzan las versiones parcheadas dentro de su subárbol.
# postcss 8.5.x ya es la versión que usa el pipeline de Tailwind v4.
overrides:
  "next>postcss": "^8.5.28"
  "next>sharp": "^0.35.4"
