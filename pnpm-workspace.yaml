allowBuilds:
  core-js: true
  sharp: true

# Next.js fija versiones exactas de postcss y sharp que arrastran advisories
# conocidos. Se fuerzan las versiones parcheadas dentro de su subárbol.
# postcss 8.5.x ya es la versión que usa el pipeline de Tailwind v4.
overrides:
  "next>postcss": "^8.5.28"
  "next>sharp": "^0.35.4"
